<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="teal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d6b0"/>
    </marker>
    <marker id="tealStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,0 L0,3 L7,6 Z" fill="#34d6b0"/>
    </marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e6b450"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1080" height="720" fill="#0b1020"/>

  <!-- title -->
  <text x="40" y="40" fill="#eef2ff" font-size="20" font-weight="700">AlignOS — a mesh of edge-owned TEEs</text>
  <text x="40" y="64" fill="#8b93b8" font-size="13">Your expertise leaves home only as redacted, TEE-gated answers — never as raw data.</text>

  <!-- mesh tagline -->
  <text x="540" y="92" fill="#34d6b0" font-size="12.5" font-weight="600" text-anchor="middle" letter-spacing="0.3">edge-to-edge A2A — redacted, TEE-gated responses</text>

  <!-- ============ TEE ROW ============ -->
  <!-- C1 Shashank @ center 220 ; C2 Andrew @ 540 ; C3 Albi @ 860 -->

  <!-- A2A connectors between TEEs (y=164) -->
  <line x1="352" y1="166" x2="408" y2="166" stroke="#34d6b0" stroke-width="2" marker-start="url(#tealStart)" marker-end="url(#teal)"/>
  <line x1="672" y1="166" x2="728" y2="166" stroke="#34d6b0" stroke-width="2" marker-start="url(#tealStart)" marker-end="url(#teal)"/>

  <!-- TEE box template: x=center-132, y=100, w=264, h=132 -->
  <!-- C1 -->
  <g>
    <rect x="88" y="100" width="264" height="132" rx="12" fill="#121a33" stroke="#2c6f63" stroke-width="1.5"/>
    <text x="110" y="128" fill="#34d6b0" font-size="14.5" font-weight="700">🛡 Shashank’s TEE</text>
    <text x="110" y="147" fill="#8b93b8" font-size="11" font-style="italic">always-on private space</text>
    <line x1="110" y1="158" x2="330" y2="158" stroke="#2a3357" stroke-width="1"/>
    <text x="110" y="180" fill="#cdd4f0" font-size="11.5">gatekeep · redact · queue · attest</text>
    <rect x="110" y="196" width="132" height="22" rx="11" fill="#0e1530" stroke="#2c6f63" stroke-width="1"/>
    <text x="120" y="211" fill="#34d6b0" font-size="10.5">mode: tee · attested</text>
    <text x="330" y="125" fill="#6f78a0" font-size="10.5" text-anchor="end">system design</text>
  </g>
  <!-- C2 -->
  <g>
    <rect x="408" y="100" width="264" height="132" rx="12" fill="#121a33" stroke="#2c6f63" stroke-width="1.5"/>
    <text x="430" y="128" fill="#34d6b0" font-size="14.5" font-weight="700">🛡 Andrew’s TEE</text>
    <text x="430" y="147" fill="#8b93b8" font-size="11" font-style="italic">always-on private space</text>
    <line x1="430" y1="158" x2="650" y2="158" stroke="#2a3357" stroke-width="1"/>
    <text x="430" y="180" fill="#cdd4f0" font-size="11.5">gatekeep · redact · queue · attest</text>
    <rect x="430" y="196" width="132" height="22" rx="11" fill="#0e1530" stroke="#2c6f63" stroke-width="1"/>
    <text x="440" y="211" fill="#34d6b0" font-size="10.5">mode: tee · attested</text>
    <text x="650" y="125" fill="#6f78a0" font-size="10.5" text-anchor="end">confidential compute</text>
  </g>
  <!-- C3 -->
  <g>
    <rect x="728" y="100" width="264" height="132" rx="12" fill="#121a33" stroke="#2c6f63" stroke-width="1.5"/>
    <text x="750" y="128" fill="#34d6b0" font-size="14.5" font-weight="700">🛡 Albi’s TEE</text>
    <text x="750" y="147" fill="#8b93b8" font-size="11" font-style="italic">always-on private space</text>
    <line x1="750" y1="158" x2="970" y2="158" stroke="#2a3357" stroke-width="1"/>
    <text x="750" y="180" fill="#cdd4f0" font-size="11.5">gatekeep · redact · queue · attest</text>
    <rect x="750" y="196" width="132" height="22" rx="11" fill="#0e1530" stroke="#2c6f63" stroke-width="1"/>
    <text x="760" y="211" fill="#34d6b0" font-size="10.5">mode: tee · attested</text>
    <text x="970" y="125" fill="#6f78a0" font-size="10.5" text-anchor="end">GTM · product</text>
  </g>

  <!-- ============ redacted-slices up-arrows (laptop -> TEE) ============ -->
  <line x1="220" y1="420" x2="220" y2="234" stroke="#34d6b0" stroke-width="2.5" marker-end="url(#teal)"/>
  <line x1="540" y1="420" x2="540" y2="234" stroke="#34d6b0" stroke-width="2.5" marker-end="url(#teal)"/>
  <line x1="860" y1="420" x2="860" y2="234" stroke="#34d6b0" stroke-width="2.5" marker-end="url(#teal)"/>
  <text x="206" y="402" fill="#34d6b0" font-size="10.5" text-anchor="end">redacted</text>
  <text x="206" y="415" fill="#34d6b0" font-size="10.5" text-anchor="end">slices only ↑</text>

  <!-- ============ the privacy boundary ============ -->
  <line x1="40" y1="330" x2="1040" y2="330" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="9 6"/>
  <!-- checkpoint badge over the line -->
  <rect x="350" y="312" width="380" height="36" rx="18" fill="#1a0e15" stroke="#ff5c5c" stroke-width="1.5"/>
  <text x="540" y="335" fill="#ff7a7a" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="0.6">RAW LOGS NEVER CROSS THIS LINE</text>
  <text x="540" y="364" fill="#8b93b8" font-size="10.5" text-anchor="middle">only redacted slices go up · only TEE-gated answers come down</text>

  <!-- ============ LAPTOP ROW (edge devices) ============ -->
  <!-- laptop template centered at C, screen y=420..520 -->
  <!-- C1 -->
  <g>
    <rect x="125" y="420" width="190" height="100" rx="8" fill="#0e1530" stroke="#3a456f" stroke-width="1.5"/>
    <text x="140" y="442" fill="#eef2ff" font-size="12" font-weight="700">your laptop · edge</text>
    <text x="140" y="463" fill="#aab2da" font-size="10.5">raw agent logs (~/.claude…)</text>
    <text x="140" y="481" fill="#aab2da" font-size="10.5">Electron client</text>
    <text x="140" y="499" fill="#aab2da" font-size="10.5">local redactor</text>
    <text x="140" y="514" fill="#6f78a0" font-size="9.5">deny-by-default folder scope</text>
    <polygon points="105,544 335,544 315,522 125,522" fill="#0e1530" stroke="#3a456f" stroke-width="1.5"/>
  </g>
  <!-- C2 -->
  <g>
    <rect x="445" y="420" width="190" height="100" rx="8" fill="#0e1530" stroke="#3a456f" stroke-width="1.5"/>
    <text x="460" y="442" fill="#eef2ff" font-size="12" font-weight="700">your laptop · edge</text>
    <text x="460" y="463" fill="#aab2da" font-size="10.5">raw agent logs (~/.codex…)</text>
    <text x="460" y="481" fill="#aab2da" font-size="10.5">Electron client</text>
    <text x="460" y="499" fill="#aab2da" font-size="10.5">local redactor</text>
    <text x="460" y="514" fill="#6f78a0" font-size="9.5">deny-by-default folder scope</text>
    <polygon points="425,544 655,544 635,522 445,522" fill="#0e1530" stroke="#3a456f" stroke-width="1.5"/>
  </g>
  <!-- C3 -->
  <g>
    <rect x="765" y="420" width="190" height="100" rx="8" fill="#0e1530" stroke="#3a456f" stroke-width="1.5"/>
    <text x="780" y="442" fill="#eef2ff" font-size="12" font-weight="700">your laptop · edge</text>
    <text x="780" y="463" fill="#aab2da" font-size="10.5">raw agent logs (~/.pi…)</text>
    <text x="780" y="481" fill="#aab2da" font-size="10.5">Electron client</text>
    <text x="780" y="499" fill="#aab2da" font-size="10.5">local redactor</text>
    <text x="780" y="514" fill="#6f78a0" font-size="9.5">deny-by-default folder scope</text>
    <polygon points="745,544 975,544 955,522 765,522" fill="#0e1530" stroke="#3a456f" stroke-width="1.5"/>
  </g>

  <!-- ============ registry anchor ============ -->
  <!-- connectors: TEE bottom-right -> registry top, in the gutters (clear of laptops) -->
  <line x1="352" y1="232" x2="352" y2="632" stroke="#e6b450" stroke-width="1.3" stroke-dasharray="4 5" marker-end="url(#amber)"/>
  <line x1="672" y1="232" x2="672" y2="632" stroke="#e6b450" stroke-width="1.3" stroke-dasharray="4 5" marker-end="url(#amber)"/>
  <line x1="992" y1="232" x2="992" y2="632" stroke="#e6b450" stroke-width="1.3" stroke-dasharray="4 5" marker-end="url(#amber)"/>
  <text x="364" y="430" fill="#e6b450" font-size="9.5">registers + attests</text>

  <rect x="40" y="632" width="1000" height="60" rx="12" fill="#15110a" stroke="#e6b450" stroke-width="1.5"/>
  <text x="540" y="660" fill="#e6b450" font-size="14" font-weight="700" text-anchor="middle">AlignRegistry · Ethereum Sepolia</text>
  <text x="540" y="681" fill="#9a8f74" font-size="10.5" text-anchor="middle">on-chain discovery + remote-attestation anchor — each TEE self-registers (node_id · pubkey · code measurement · gateway URL)</text>
</svg>
