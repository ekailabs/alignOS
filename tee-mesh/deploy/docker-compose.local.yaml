# Local 3-CVM mesh in containers — same images/compose Phala runs, minus the dstack socket
# (nodes use local-identity mode). anvil + a one-shot deployer give a deterministic registry
# address (first tx from account[0] => 0x5FbDB2315678afecb367f032d93F642f64180aa3).
# Skills are distributed: albi=calc, andrew=weather, shashank=define — so /route fans across.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["anvil --host 0.0.0.0 --silent"]
    networks: [mesh]

  deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on: { anvil: { condition: service_started } }
    working_dir: /contracts
    volumes: ["../contracts:/contracts"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until cast chain-id --rpc-url http://anvil:8545 >/dev/null 2>&1; do sleep 0.5; done
        forge create src/AlignRegistry.sol:AlignRegistry \
          --rpc-url http://anvil:8545 --broadcast \
          --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    networks: [mesh]

  calc-albi:       { build: ../agents/skill, environment: { SKILL: calc },    networks: [agents-albi] }
  weather-andrew:  { build: ../agents/skill, environment: { SKILL: weather }, networks: [agents-andrew] }
  define-shashank: { build: ../agents/skill, environment: { SKILL: define },  networks: [agents-shashank] }

  albi:
    build: ../node
    depends_on: { deployer: { condition: service_completed_successfully } }
    ports: ["${ALIGN_HOST_PORT_A:-8081}:8080"]
    volumes: ["./manifest.a.json:/app/manifest.json:ro", "albi-data:/data"]
    environment:
      ALIGN_NODE_ID: albi
      ALIGN_OWNER_HANDLE: albi
      ALIGN_OWNER_DISPLAY_NAME: Albi
      ALIGN_SELF_URL: http://albi:8080
      ALIGN_MANIFEST: /app/manifest.json
      ALIGN_TASKS: /data/tasks.json
      ALIGN_EVENTLOG: /data/events.jsonl
      ALIGN_PEERS: /data/peers.json
      ALIGN_GOSSIP_INTERVAL: "2"
      REGISTRY_RPC: http://anvil:8545
      REGISTRY_CONTRACT: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
    networks: [mesh, agents-albi]

  andrew:
    build: ../node
    depends_on: { deployer: { condition: service_completed_successfully } }
    ports: ["${ALIGN_HOST_PORT_B:-8082}:8080"]
    volumes: ["./manifest.b.json:/app/manifest.json:ro", "andrew-data:/data"]
    environment:
      ALIGN_NODE_ID: andrew
      ALIGN_OWNER_HANDLE: andrew
      ALIGN_OWNER_DISPLAY_NAME: Andrew
      ALIGN_SELF_URL: http://andrew:8080
      ALIGN_MANIFEST: /app/manifest.json
      ALIGN_TASKS: /data/tasks.json
      ALIGN_EVENTLOG: /data/events.jsonl
      ALIGN_PEERS: /data/peers.json
      ALIGN_GOSSIP_INTERVAL: "2"
      REGISTRY_RPC: http://anvil:8545
      REGISTRY_CONTRACT: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      PRIVATE_KEY: "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
    networks: [mesh, agents-andrew]

  shashank:
    build: ../node
    depends_on: { deployer: { condition: service_completed_successfully } }
    ports: ["${ALIGN_HOST_PORT_C:-8083}:8080"]
    volumes: ["./manifest.c.json:/app/manifest.json:ro", "shashank-data:/data"]
    environment:
      ALIGN_NODE_ID: shashank
      ALIGN_OWNER_HANDLE: shashank
      ALIGN_OWNER_DISPLAY_NAME: Shashank
      ALIGN_SELF_URL: http://shashank:8080
      ALIGN_MANIFEST: /app/manifest.json
      ALIGN_TASKS: /data/tasks.json
      ALIGN_EVENTLOG: /data/events.jsonl
      ALIGN_PEERS: /data/peers.json
      ALIGN_GOSSIP_INTERVAL: "2"
      REGISTRY_RPC: http://anvil:8545
      REGISTRY_CONTRACT: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      PRIVATE_KEY: "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6"
    networks: [mesh, agents-shashank]

networks:
  mesh: {}
  agents-albi: { internal: true }
  agents-andrew: { internal: true }
  agents-shashank: { internal: true }
volumes:
  albi-data: {}
  andrew-data: {}
  shashank-data: {}
