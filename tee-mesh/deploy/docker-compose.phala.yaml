# Phala/dstack deploy: pre-built images pulled from ghcr (no build context on the CVM),
# manifest passed inline via env (no host files to bind-mount), dstack socket mounted for
# TEE identity. Agents on an internal network; the node is their sole egress.
services:
  node:
    image: ghcr.io/sm86/alignos-node:latest
    ports: ["8080:8080"]
    environment:
      ALIGN_SELF_URL: ${ALIGN_SELF_URL}
      ALIGN_MANIFEST_JSON: ${ALIGN_MANIFEST_JSON}
      ALIGN_GOSSIP_INTERVAL: ${ALIGN_GOSSIP_INTERVAL:-5}
      REGISTRY_RPC: ${REGISTRY_RPC}
      REGISTRY_CONTRACT: ${REGISTRY_CONTRACT}
      PRIVATE_KEY: ${PRIVATE_KEY}
      DSTACK_SOCKET: /var/run/dstack.sock
      ALIGN_OWNER_STATE: /data/owner.json
      ALIGN_TASKS: /data/tasks.json
      ALIGN_EVENTLOG: /data/events.jsonl
      ALIGN_PEERS: /data/peers.json
      ALIGN_KNOWLEDGE: /data/knowledge.json
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - alignos-data:/data
    networks: [default, agents]
  echo:
    image: ghcr.io/sm86/alignos-echo:latest
    networks: [agents]
  ping:
    image: ghcr.io/sm86/alignos-ping:latest
    networks: [agents]
networks:
  agents:
    internal: true
volumes:
  alignos-data: {}
